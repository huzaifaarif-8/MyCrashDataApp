<div class="login-page">
  <div class="login-card">
    <div class="login-logo">&#9992;</div>
    <h1 class="login-title">CrashData</h1>
    <p class="login-sub">Sign in to access the dashboard</p>

    <form class="login-form" (ngSubmit)="onSubmit()">
      <div class="field">
        <label for="username">Username</label>
        <input
          id="username"
          type="text"
          [(ngModel)]="username"
          name="username"
          placeholder="admin"
          autocomplete="username"
          [disabled]="loading"
        />
      </div>

      <div class="field">
        <label for="password">Password</label>
        <input
          id="password"
          type="password"
          [(ngModel)]="password"
          name="password"
          placeholder="••••••••"
          autocomplete="current-password"
          [disabled]="loading"
        />
      </div>

      @if (error) {
        <div class="login-error">{{ error }}</div>
      }

      <button type="submit" class="login-btn" [disabled]="loading || !username || !password">
        @if (loading) {
          <span class="btn-spinner"></span> Signing in…
        } @else {
          Sign in
        }
      </button>
    </form>
  </div>
</div>
